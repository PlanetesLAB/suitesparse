name: release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  suitesparse:
    uses: PlanetesLAB/release-workflows/.github/workflows/release.yml@v1
    with:
      manifest: suitesparse/Cargo.toml
      tag-prefix: suitesparse-v
      submodules: true
      apt-packages: "libclang-dev cmake gfortran libblas-dev liblapack-dev libopenblas-dev libmpfr-dev libgomp1"
      test-command: cargo test --workspace --all-features
    secrets:
      DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}

  suitesparse-sys:
    uses: PlanetesLAB/release-workflows/.github/workflows/release.yml@v1
    with:
      manifest: suitesparse-sys/Cargo.toml
      tag-prefix: suitesparse-sys-v
      submodules: true
      apt-packages: "libclang-dev cmake gfortran libblas-dev liblapack-dev libopenblas-dev libmpfr-dev libgomp1"
      test-command: cargo test --workspace --all-features
    secrets:
      DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
